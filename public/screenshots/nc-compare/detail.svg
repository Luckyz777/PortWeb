<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NC Compare detail view</title>
  <desc id="desc">Three-panel detail view showing original line, new line, and interpreted result.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="36" y="36" width="1368" height="828" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="90" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Difference Detail</text>
  <text x="64" y="124" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="17">Focused token diff for one N-block change</text>
  <g font-family="Consolas, monospace">
    <rect x="64" y="170" width="400" height="560" rx="12" fill="#fee2e2"/>
    <text x="88" y="210" fill="#991b1b" font-size="20" font-weight="700">Original</text>
    <text x="88" y="276" fill="#7f1d1d" font-size="18">N140 G1 Z-8.20 F120.</text>
    <text x="88" y="324" fill="#7f1d1d" font-size="18">N150 X42.5 Y18.0</text>
    <text x="88" y="372" fill="#7f1d1d" font-size="18">N160 S8000</text>
    <rect x="520" y="170" width="400" height="560" rx="12" fill="#dcfce7"/>
    <text x="544" y="210" fill="#166534" font-size="20" font-weight="700">New</text>
    <text x="544" y="276" fill="#14532d" font-size="18">N140 G1 Z-8.60 F180.</text>
    <text x="544" y="324" fill="#14532d" font-size="18">N150 X42.5 Y18.0</text>
    <text x="544" y="372" fill="#14532d" font-size="18">N160 S9500</text>
    <rect x="976" y="170" width="364" height="560" rx="12" fill="#eff6ff"/>
    <text x="1000" y="210" fill="#1d4ed8" font-size="20" font-weight="700">Result</text>
    <text x="1000" y="276" fill="#1e40af" font-size="18">Z depth changed</text>
    <text x="1000" y="324" fill="#1e40af" font-size="18">Feed changed: F120 -> F180</text>
    <text x="1000" y="372" fill="#1e40af" font-size="18">Speed changed: S8000 -> S9500</text>
  </g>
</svg>
