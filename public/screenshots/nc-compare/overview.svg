<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NC Compare overview</title>
  <desc id="desc">A side-by-side NC file comparison screen with change filters and export actions.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="68" fill="#111827"/>
  <text x="28" y="43" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">NC File Comparison App</text>
  <rect x="28" y="96" width="300" height="52" rx="8" fill="#e2e8f0"/>
  <rect x="348" y="96" width="300" height="52" rx="8" fill="#e2e8f0"/>
  <text x="48" y="128" fill="#334155" font-family="Consolas, monospace" font-size="18">1244.nc</text>
  <text x="368" y="128" fill="#334155" font-family="Consolas, monospace" font-size="18">1244_RW.nc</text>
  <rect x="1040" y="102" width="142" height="40" rx="8" fill="#2563eb"/>
  <text x="1070" y="128" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Compare</text>
  <rect x="1196" y="102" width="120" height="40" rx="8" fill="#f97316"/>
  <text x="1224" y="128" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Export</text>
  <rect x="28" y="178" width="1384" height="660" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="28" y="178" width="1384" height="52" rx="14" fill="#eaf2ff"/>
  <text x="54" y="212" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">New Change Log</text>
  <g font-family="Consolas, monospace" font-size="17">
    <text x="64" y="278" fill="#475569">Scope</text>
    <text x="220" y="278" fill="#475569">Line</text>
    <text x="330" y="278" fill="#475569">Change</text>
    <text x="780" y="278" fill="#475569">Details</text>
    <rect x="54" y="304" width="1324" height="56" fill="#fff7ed"/>
    <text x="64" y="340" fill="#9a3412">N Block</text>
    <text x="220" y="340" fill="#9a3412">N140</text>
    <text x="330" y="340" fill="#9a3412">Feed changed</text>
    <text x="780" y="340" fill="#9a3412">F120 -> F180</text>
    <rect x="54" y="380" width="1324" height="56" fill="#eff6ff"/>
    <text x="64" y="416" fill="#1d4ed8">N Block</text>
    <text x="220" y="416" fill="#1d4ed8">N130</text>
    <text x="330" y="416" fill="#1d4ed8">Speed changed</text>
    <text x="780" y="416" fill="#1d4ed8">S8000 -> S9500</text>
    <rect x="54" y="456" width="1324" height="56" fill="#f0fdf4"/>
    <text x="64" y="492" fill="#166534">Tool</text>
    <text x="220" y="492" fill="#166534">T12</text>
    <text x="330" y="492" fill="#166534">Tool added</text>
    <text x="780" y="492" fill="#166534">New finishing operation</text>
  </g>
</svg>
