<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NC Compare report output</title>
  <desc id="desc">Export-ready NC comparison report summary.</desc>
  <rect width="1440" height="900" fill="#e2e8f0"/>
  <rect x="260" y="54" width="920" height="792" fill="#fff" stroke="#cbd5e1"/>
  <text x="318" y="128" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">NC Revision Comparison Report</text>
  <text x="318" y="172" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18">1244.nc vs 1244_RW.nc</text>
  <rect x="318" y="218" width="804" height="1" fill="#cbd5e1"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="318" y="274" fill="#0f172a" font-size="22" font-weight="700">Major Changes</text>
    <rect x="318" y="306" width="804" height="54" fill="#fff7ed"/>
    <text x="342" y="340" fill="#9a3412" font-size="17">N140: Feed F120 -> F180, Z -8.20 -> -8.60</text>
    <rect x="318" y="376" width="804" height="54" fill="#eff6ff"/>
    <text x="342" y="410" fill="#1d4ed8" font-size="17">N130: Spindle speed S8000 -> S9500</text>
    <rect x="318" y="446" width="804" height="54" fill="#f0fdf4"/>
    <text x="342" y="480" fill="#166534" font-size="17">T12: Added finishing toolpath</text>
    <text x="318" y="560" fill="#0f172a" font-size="22" font-weight="700">Review Notes</text>
    <text x="318" y="604" fill="#334155" font-size="18">- Token-level changes are grouped by N-block.</text>
    <text x="318" y="640" fill="#334155" font-size="18">- Export can be attached to ECN paperwork.</text>
    <text x="318" y="676" fill="#334155" font-size="18">- Encoding fallback supports Thai and Japanese comments.</text>
  </g>
</svg>
