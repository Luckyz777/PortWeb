<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">NC Compare interface preview</title>
  <desc id="desc">NC file revision comparison interface with token-level change tracking.</desc>
